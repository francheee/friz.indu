<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Friz Indu · Recursos para productos</title>
    <style>
        :root {
            color-scheme: light;
            --primary: #1d4ed8;
            --primary-dark: #1e40af;
            --surface: #f8fafc;
            --border: #e2e8f0;
            --text: #0f172a;
            --muted: #475569;
            --shadow: 0 10px 30px rgba(15, 23, 42, 0.12);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
            background: var(--surface);
            color: var(--text);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            padding: 2.5rem 1.5rem 2rem;
            text-align: center;
            background: linear-gradient(135deg, #1d4ed8, #3b82f6);
            color: white;
            box-shadow: var(--shadow);
        }

        header h1 {
            margin: 0 0 0.75rem;
            font-size: clamp(2rem, 3vw + 1rem, 3.4rem);
            letter-spacing: -0.02em;
        }

        header p {
            margin: 0;
            font-size: clamp(1rem, 1vw + 0.9rem, 1.2rem);
            color: rgba(255, 255, 255, 0.85);
        }

        main {
            flex: 1;
            padding: clamp(1.5rem, 3vw, 3rem);
            max-width: 1100px;
            width: 100%;
            margin: 0 auto;
        }

        .grid-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1.25rem;
            margin-bottom: 2.5rem;
        }

        .product-btn {
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.5rem;
            background: white;
            text-align: left;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        .product-btn::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.15), rgba(37, 99, 235, 0));
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .product-btn:hover,
        .product-btn:focus {
            transform: translateY(-4px);
            box-shadow: var(--shadow);
            border-color: rgba(29, 78, 216, 0.4);
            outline: none;
        }

        .product-btn:hover::after,
        .product-btn:focus::after {
            opacity: 1;
        }

        .product-btn h2 {
            margin: 0 0 0.35rem;
            font-size: 1.2rem;
        }

        .product-btn p {
            margin: 0;
            font-size: 0.95rem;
            color: var(--muted);
        }

        .details-card {
            background: white;
            border-radius: 24px;
            padding: clamp(1.75rem, 3vw, 2.5rem);
            box-shadow: var(--shadow);
            border: 1px solid rgba(148, 163, 184, 0.2);
            display: grid;
            gap: 2rem;
        }

        .details-header h2 {
            margin: 0 0 0.75rem;
            font-size: clamp(1.8rem, 2vw + 1rem, 2.4rem);
        }

        .details-header p {
            margin: 0;
            color: var(--muted);
            font-size: 1rem;
        }

        .text-snippets ul {
            list-style: none;
            padding: 0;
            margin: 0;
            display: grid;
            gap: 0.75rem;
        }

        .snippet {
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 1rem 1.1rem;
            display: grid;
            gap: 0.75rem;
            background: #f8fafc;
        }

        .snippet p {
            margin: 0;
            font-size: 0.98rem;
            line-height: 1.5;
        }

        .snippet button {
            justify-self: start;
        }

        .media-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1.5rem;
        }

        .media-card {
            border-radius: 18px;
            border: 1px solid var(--border);
            overflow: hidden;
            background: white;
            display: flex;
            flex-direction: column;
            box-shadow: 0 12px 24px rgba(15, 23, 42, 0.08);
        }

        .media-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        .media-card footer {
            padding: 1rem 1.1rem 1.25rem;
            display: grid;
            gap: 0.75rem;
            background: white;
        }

        .media-card footer h4 {
            margin: 0;
            font-size: 1rem;
        }

        .media-actions {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        button {
            border: none;
            border-radius: 999px;
            padding: 0.55rem 1.1rem;
            background: var(--primary);
            color: white;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.95rem;
            transition: background 0.2s ease;
        }

        button:hover,
        button:focus {
            background: var(--primary-dark);
            outline: none;
        }

        .ghost-btn {
            background: rgba(37, 99, 235, 0.1);
            color: var(--primary);
        }

        .ghost-btn:hover,
        .ghost-btn:focus {
            background: rgba(37, 99, 235, 0.2);
            color: var(--primary-dark);
        }

        .status {
            position: fixed;
            left: 50%;
            bottom: 32px;
            transform: translateX(-50%);
            background: #0f172a;
            color: white;
            padding: 0.85rem 1.4rem;
            border-radius: 999px;
            box-shadow: 0 20px 40px rgba(15, 23, 42, 0.2);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            font-size: 0.95rem;
        }

        .status.visible {
            opacity: 0.96;
        }

        footer.site-footer {
            text-align: center;
            padding: 2rem 1rem;
            color: var(--muted);
            font-size: 0.95rem;
        }

        @media (max-width: 768px) {
            header {
                padding: 2.5rem 1.25rem 1.75rem;
            }

            .media-card img {
                height: 160px;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Catálogo rápido de recursos</h1>
        <p>Seleccioná un tipo de producto y obtené textos sugeridos e imágenes listas para compartir.</p>
    </header>

    <main>
        <section aria-label="Listado de tipos de productos">
            <div class="grid-buttons" id="productButtons"></div>
        </section>

        <section aria-live="polite" aria-label="Detalle del producto seleccionado" id="productDetails" hidden>
            <article class="details-card">
                <div class="details-header">
                    <h2 id="productTitle"></h2>
                    <p id="productDescription"></p>
                </div>

                <div class="text-snippets">
                    <h3>Textos sugeridos</h3>
                    <ul id="textList"></ul>
                </div>

                <div class="media-section">
                    <h3>Imágenes destacadas</h3>
                    <div class="media-grid" id="imageGrid"></div>
                </div>
            </article>
        </section>
    </main>

    <div class="status" id="statusToast" role="status" aria-live="assertive"></div>

    <footer class="site-footer">
        © 2025 Friz Indu · Material rápido para redes y clientes.
    </footer>

    <script>
        const catalog = [
            {
                id: "banderas",
                title: "Banderas personalizadas",
                description: "Diseños listos para hinchadas, clubes y eventos especiales.",
                texts: [
                    "🔥 Hacé que tu tribuna se note con banderas personalizadas desde 1.20 m de ancho.",
                    "🎨 Estampado full color y telas resistentes al viento para uso en interior o exterior.",
                    "⏱️ Entregas en 7 días hábiles y descuentos para pedidos por volumen."
                ],
                images: [
                    {
                        src: "https://images.unsplash.com/photo-1455732063391-5f50f8a0b5b0?auto=format&fit=crop&w=800&q=80",
                        alt: "Bandera ondeando en un estadio",
                        title: "Bandera estadio"
                    },
                    {
                        src: "https://images.unsplash.com/photo-1530546177248-e81d6cd834c6?auto=format&fit=crop&w=800&q=80",
                        alt: "Banderas coloridas en un festival",
                        title: "Set de banderas"
                    }
                ]
            },
            {
                id: "camisetas",
                title: "Camisetas deportivas",
                description: "Uniformes técnicos con telas respirables y estampado sublimado de alta definición.",
                texts: [
                    "💨 Tela dry-fit liviana para entrenamientos intensos y torneos.",
                    "👕 Personalizá nombre, número y sponsors sin costo extra.",
                    "🛡️ Costuras reforzadas y protección UV 30+ ideal para deportes al aire libre."
                ],
                images: [
                    {
                        src: "https://images.unsplash.com/photo-1517649763962-0c623066013b?auto=format&fit=crop&w=800&q=80",
                        alt: "Jugadores con camisetas deportivas personalizadas",
                        title: "Equipo uniforme"
                    },
                    {
                        src: "https://images.unsplash.com/photo-1521572267360-ee0c2909d518?auto=format&fit=crop&w=800&q=80",
                        alt: "Camisetas deportivas colgadas",
                        title: "Colección camisetas"
                    }
                ]
            },
            {
                id: "merchandising",
                title: "Merchandising express",
                description: "Kit promocional con gorras, mochilas y botellas personalizadas.",
                texts: [
                    "🎁 Armamos packs personalizados con tu logo listos para entregar.",
                    "🚀 Producción express en 72 hs para activaciones y lanzamientos.",
                    "♻️ Opciones eco-friendly con materiales reciclados y tintas al agua."
                ],
                images: [
                    {
                        src: "https://images.unsplash.com/photo-1462212210333-335063b676d3?auto=format&fit=crop&w=800&q=80",
                        alt: "Gorras promocionales coloridas",
                        title: "Gorras personalizadas"
                    },
                    {
                        src: "https://images.unsplash.com/photo-1528459801416-a9e53bbf4e17?auto=format&fit=crop&w=800&q=80",
                        alt: "Botellas de aluminio y cuadernos para merchandising",
                        title: "Kit corporativo"
                    }
                ]
            }
        ];

        const productButtons = document.getElementById("productButtons");
        const productDetails = document.getElementById("productDetails");
        const productTitle = document.getElementById("productTitle");
        const productDescription = document.getElementById("productDescription");
        const textList = document.getElementById("textList");
        const imageGrid = document.getElementById("imageGrid");
        const statusToast = document.getElementById("statusToast");

        function showStatus(message) {
            statusToast.textContent = message;
            statusToast.classList.add("visible");
            clearTimeout(showStatus.timeoutId);
            showStatus.timeoutId = setTimeout(() => {
                statusToast.classList.remove("visible");
            }, 2200);
        }

        async function copyImageToClipboard(url, title) {
            if (!navigator.clipboard || typeof ClipboardItem === "undefined") {
                await navigator.clipboard?.writeText(url);
                showStatus("URL copiada: " + title);
                return;
            }

            try {
                const response = await fetch(url, { mode: "cors" });
                const blob = await response.blob();
                const item = new ClipboardItem({ [blob.type]: blob });
                await navigator.clipboard.write([item]);
                showStatus("Imagen copiada al portapapeles");
            } catch (error) {
                await navigator.clipboard.writeText(url);
                showStatus("No se pudo copiar la imagen, se copió el enlace.");
            }
        }

        async function copyTextSnippet(text) {
            try {
                await navigator.clipboard.writeText(text);
                showStatus("Texto copiado ✔");
            } catch (error) {
                showStatus("No se pudo copiar. Copiá manualmente.");
            }
        }

        function downloadImage(url, title) {
            const anchor = document.createElement("a");
            anchor.href = url;
            anchor.download = title.replace(/\s+/g, "-").toLowerCase();
            document.body.appendChild(anchor);
            anchor.click();
            document.body.removeChild(anchor);
            showStatus("Descarga iniciada");
        }

        function renderProduct(product) {
            productTitle.textContent = product.title;
            productDescription.textContent = product.description;

            textList.innerHTML = "";
            product.texts.forEach((text) => {
                const li = document.createElement("li");
                li.className = "snippet";

                const paragraph = document.createElement("p");
                paragraph.textContent = text;

                const copyBtn = document.createElement("button");
                copyBtn.type = "button";
                copyBtn.textContent = "Copiar texto";
                copyBtn.addEventListener("click", () => copyTextSnippet(text));

                li.appendChild(paragraph);
                li.appendChild(copyBtn);
                textList.appendChild(li);
            });

            imageGrid.innerHTML = "";
            product.images.forEach((image) => {
                const card = document.createElement("article");
                card.className = "media-card";

                const img = document.createElement("img");
                img.src = image.src;
                img.alt = image.alt;
                img.loading = "lazy";

                const footer = document.createElement("footer");

                const heading = document.createElement("h4");
                heading.textContent = image.title;

                const actions = document.createElement("div");
                actions.className = "media-actions";

                const copyImageBtn = document.createElement("button");
                copyImageBtn.type = "button";
                copyImageBtn.textContent = "Copiar";
                copyImageBtn.addEventListener("click", () => copyImageToClipboard(image.src, image.title));

                const downloadBtn = document.createElement("button");
                downloadBtn.type = "button";
                downloadBtn.textContent = "Descargar";
                downloadBtn.classList.add("ghost-btn");
                downloadBtn.addEventListener("click", () => downloadImage(image.src, image.title));

                actions.append(copyImageBtn, downloadBtn);
                footer.append(heading, actions);
                card.append(img, footer);
                imageGrid.appendChild(card);
            });

            productDetails.hidden = false;
            productDetails.scrollIntoView({ behavior: "smooth", block: "start" });
        }

        function renderButtons() {
            catalog.forEach((product) => {
                const button = document.createElement("button");
                button.type = "button";
                button.className = "product-btn";
                button.innerHTML = `<h2>${product.title}</h2><p>${product.description}</p>`;
                button.addEventListener("click", () => renderProduct(product));
                productButtons.appendChild(button);
            });
        }

        renderButtons();
        renderProduct(catalog[0]);
    </script>
</body>
</html>
